name: causal-rps-particle-convergence

on:
  push:
    paths:
      - ".github/workflows/causal-rps-particle-convergence.yml"
      - "projects/causal-self-contingency-rps/scripts/particle_convergence.py"
  workflow_dispatch:

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: projects/causal-self-contingency-rps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Unit tests
        run: pytest -q
      - name: Fixed-dataset SMC convergence audit
        run: |
          python scripts/particle_convergence.py \
            --n-per-true 8 \
            --T 196 \
            --fit-seeds 3 \
            --output results/gate1/particle_convergence.json
      - name: Display summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("results/gate1/particle_convergence.json").read_text())
          print(json.dumps(x["summary"], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: particle-convergence
          path: projects/causal-self-contingency-rps/results/gate1/particle_convergence.json
          retention-days: 30
