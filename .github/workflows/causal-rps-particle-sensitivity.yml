name: causal-rps-particle-sensitivity

on:
  push:
    paths:
      - ".github/workflows/causal-rps-particle-sensitivity.yml"
  workflow_dispatch:

jobs:
  particle-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        particles: [4, 16, 64]
    defaults:
      run:
        working-directory: projects/causal-self-contingency-rps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Tests
        run: pytest -q
      - name: Particle sensitivity preflight
        run: |
          python scripts/gate1_runner.py \
            --preflight \
            --n-sim 5 \
            --T 196 \
            --particles ${{ matrix.particles }} \
            --workers 2 \
            --seed 42 \
            --output results/gate1/particle_${{ matrix.particles }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: particle-${{ matrix.particles }}
          path: projects/causal-self-contingency-rps/results/gate1/particle_${{ matrix.particles }}.json
          retention-days: 30
