name: causal-rps-preflight

on:
  push:
    branches:
      - causal-self-contingency-rps
  pull_request:
    paths:
      - "projects/causal-self-contingency-rps/**"
      - ".github/workflows/causal-rps-preflight.yml"
  workflow_dispatch:

jobs:
  test-and-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/causal-self-contingency-rps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests
        run: pytest -q

      - name: Run implementation-only preflight
        run: |
          python scripts/gate1_runner.py \
            --preflight \
            --n-sim 5 \
            --T 196 \
            --particles 4 \
            --workers 2 \
            --seed 42 \
            --output results/gate1/preflight_ci.json

      - name: Validate preflight label
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("results/gate1/preflight_ci.json").read_text())
          assert x["mode"] == "preflight"
          assert x["decision"] == "IMPLEMENTATION_ONLY"
          assert x["scientific_gate"] is False
          print("Preflight correctly labeled IMPLEMENTATION_ONLY")
          PY

      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: causal-rps-preflight
          path: projects/causal-self-contingency-rps/results/gate1/preflight_ci.json
          retention-days: 30
