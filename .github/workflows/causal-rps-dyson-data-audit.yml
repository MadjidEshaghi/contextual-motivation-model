name: causal-rps-dyson-data-audit

on:
  push:
    paths:
      - ".github/workflows/causal-rps-dyson-data-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: pip install requests pandas xlrd
      - name: Download official PMC Open Access package and audit Dyson supplement
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, io, json, tarfile
          import pandas as pd
          import requests
          import xml.etree.ElementTree as ET

          pmcid = "PMC4740902"
          target_name = "srep20479-s2.xls"
          oa_api = f"https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi?id={pmcid}"
          h = {"User-Agent": "causal-rps-reproducibility-audit/1.1"}

          meta = requests.get(oa_api, headers=h, timeout=60)
          meta.raise_for_status()
          root = ET.fromstring(meta.content)
          links = root.findall(".//link")
          tgz = next((x.attrib["href"] for x in links if x.attrib.get("format") == "tgz"), None)
          if tgz is None:
              raise RuntimeError("PMC OA API returned no tgz package link")

          pkg = requests.get(tgz, headers=h, timeout=120)
          pkg.raise_for_status()
          with tarfile.open(fileobj=io.BytesIO(pkg.content), mode="r:gz") as tf:
              members = [m for m in tf.getmembers() if m.name.endswith(target_name)]
              if len(members) != 1:
                  raise RuntimeError(f"Expected one {target_name}; found {[m.name for m in members]}")
              data = tf.extractfile(members[0]).read()

          out = Path("projects/causal-self-contingency-rps/data/external/dyson2016")
          out.mkdir(parents=True, exist_ok=True)
          xls = out / target_name
          xls.write_bytes(data)

          book = pd.ExcelFile(xls, engine="xlrd")
          sheets = {}
          for name in book.sheet_names:
              df = pd.read_excel(xls, sheet_name=name, header=None, engine="xlrd")
              sheets[name] = {
                  "rows": int(df.shape[0]),
                  "cols": int(df.shape[1]),
                  "nonempty_cells": int(df.notna().sum().sum()),
              }

          audit = {
              "pmcid": pmcid,
              "oa_api": oa_api,
              "oa_package_url": tgz,
              "article_doi": "10.1038/srep20479",
              "filename": target_name,
              "size_bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "sheets": sheets,
              "classification": "official supplementary/summary material; not assumed trial-level raw",
              "license": "CC BY 4.0 per article/PMC OA record; preserve attribution and any file-specific credit line",
          }
          (out / "AUDIT.json").write_text(json.dumps(audit, indent=2), encoding="utf-8")
          (out / "LICENSE_SOURCE.txt").write_text(
              "Dyson et al. (2016), Scientific Reports 6:20479\n"
              "DOI: https://doi.org/10.1038/srep20479\n"
              "PMC: https://pmc.ncbi.nlm.nih.gov/articles/PMC4740902/\n"
              f"PMC OA API: {oa_api}\n"
              "License: CC BY 4.0 per article/PMC OA record, subject to file-specific credit lines.\n"
              "Classification: official supplementary/summary material; not represented as trial-level raw data.\n",
              encoding="utf-8",
          )
          print(json.dumps(audit, indent=2))
          PY
      - name: Commit audited supplementary file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/causal-self-contingency-rps/data/external/dyson2016
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Mirror audited Dyson 2016 CC BY supplementary summary [skip ci]"
            git push origin HEAD:main
          fi
